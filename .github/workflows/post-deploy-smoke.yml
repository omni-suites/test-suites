name: Post-deploy smoke

on:
  workflow_call:
    inputs:
      test_env:
        description: Target environment label
        type: string
        default: staging
      trigger_service:
        description: Which app service triggered this (optional attribute)
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      test_env:
        description: Target environment label
        type: choice
        default: staging
        options:
          - staging
          - local
      trigger_service:
        description: Which app service triggered this
        type: string
        required: false
        default: ''

jobs:
  smoke:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run @smoke
        env:
          CI: true
          TEST_ENV: ${{ inputs.test_env }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          ORDER_URL: ${{ vars.ORDER_URL }}
          INVENTORY_URL: ${{ vars.INVENTORY_URL }}
          NOTIFICATION_URL: ${{ vars.NOTIFICATION_URL }}
          RP_ENABLED: 'true'
          RP_ENDPOINT: ${{ vars.RP_ENDPOINT }}
          RP_PROJECT: ${{ vars.RP_PROJECT }}
          RP_API_KEY: ${{ secrets.RP_API_KEY }}
          RP_LAUNCH: post-deploy-smoke-${{ github.run_id }}
          RP_DESCRIPTION: '${{ github.workflow }} · ${{ inputs.test_env }} · ${{ inputs.trigger_service }} · ${{ github.sha }}'
        run: npx playwright test --grep @smoke

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-smoke
          path: playwright-report/
          retention-days: 7

      - name: Report Results to Omni-Integration
        if: always()
        env:
          TEST_RESULT_HOOK_URL: ${{ secrets.TEST_RESULT_HOOK_URL }}
        run: |
          if [ -n "$TEST_RESULT_HOOK_URL" ]; then
            curl -s -X POST "$TEST_RESULT_HOOK_URL" \
              -H "Content-Type: application/json" \
              -d '{
                "suite": "smoke",
                "status": "${{ job.status }}",
                "test_env": "${{ inputs.test_env }}",
                "run_id": "${{ github.run_id }}",
                "run_url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                "ref": "${{ github.ref_name }}",
                "sha": "${{ github.sha }}",
                "rp_launch": "post-deploy-smoke-${{ github.run_id }}",
                "rp_project": "omni-suites"
              }'
          else
            echo "::warning::TEST_RESULT_HOOK_URL secret is not set, skipping notification."
          fi
