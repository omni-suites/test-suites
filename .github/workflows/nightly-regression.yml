# Nightly @regression against staging + ReportPortal
#
# Requires same staging vars/secrets as e2e.yml

name: Nightly Regression

on:
  schedule:
    - cron: '0 18 * * *' # 18:00 UTC daily — adjust as needed
  workflow_dispatch:

jobs:
  regression:
    timeout-minutes: 90
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run @regression
        env:
          CI: true
          TEST_ENV: staging
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          ORDER_URL: ${{ vars.ORDER_URL }}
          INVENTORY_URL: ${{ vars.INVENTORY_URL }}
          NOTIFICATION_URL: ${{ vars.NOTIFICATION_URL }}
          RP_ENABLED: 'true'
          RP_ENDPOINT: ${{ vars.RP_ENDPOINT }}
          RP_PROJECT: ${{ vars.RP_PROJECT }}
          RP_API_KEY: ${{ secrets.RP_API_KEY }}
          RP_LAUNCH: nightly-regression-${{ github.run_id }}
          RP_DESCRIPTION: '${{ github.workflow }} · ${{ github.ref_name }} · ${{ github.sha }}'
        run: npx playwright test --grep @regression

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-nightly
          path: playwright-report/
          retention-days: 14

      - name: Report Results to Omni-Integration
        if: always()
        env:
          TEST_RESULT_HOOK_URL: ${{ secrets.TEST_RESULT_HOOK_URL }}
        run: |
          if [ -n "$TEST_RESULT_HOOK_URL" ]; then
            curl -s -X POST "$TEST_RESULT_HOOK_URL" \
              -H "Content-Type: application/json" \
              -d '{
                "suite": "regression",
                "status": "${{ job.status }}",
                "test_env": "staging",
                "run_id": "${{ github.run_id }}",
                "run_url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                "ref": "${{ github.ref_name }}",
                "sha": "${{ github.sha }}",
                "rp_launch": "nightly-regression-${{ github.run_id }}",
                "rp_project": "omni-suites"
              }'
          else
            echo "::warning::TEST_RESULT_HOOK_URL secret is not set, skipping notification."
          fi
