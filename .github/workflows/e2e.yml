# On-demand E2E — suite via tags; reports to ReportPortal when RP_API_KEY is set
#
# GitHub → Settings → Secrets and variables → Actions (or Environments → staging):
#   vars:   FRONTEND_URL, ORDER_URL, INVENTORY_URL, NOTIFICATION_URL
#   vars:   RP_ENDPOINT, RP_PROJECT
#   secret: RP_API_KEY

name: E2E

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Tag filter (smoke | sanity | regression | ui | api | all)'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - sanity
          - regression
          - ui
          - api
          - all
      test_env:
        description: 'Label for TEST_ENV / RP attributes (URLs still from vars)'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - local

jobs:
  e2e:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run suite
        env:
          CI: true
          TEST_ENV: ${{ inputs.test_env }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          ORDER_URL: ${{ vars.ORDER_URL }}
          INVENTORY_URL: ${{ vars.INVENTORY_URL }}
          NOTIFICATION_URL: ${{ vars.NOTIFICATION_URL }}
          RP_ENABLED: 'true'
          RP_ENDPOINT: ${{ vars.RP_ENDPOINT }}
          RP_PROJECT: ${{ vars.RP_PROJECT }}
          RP_API_KEY: ${{ secrets.RP_API_KEY }}
          RP_LAUNCH: e2e-${{ inputs.suite }}-${{ github.run_id }}
          RP_DESCRIPTION: '${{ github.workflow }} · ${{ inputs.suite }} · ${{ github.ref_name }} · ${{ github.sha }}'
        run: |
          if [ "${{ inputs.suite }}" = "all" ]; then
            npx playwright test
          else
            npx playwright test --grep "@${{ inputs.suite }}"
          fi

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
